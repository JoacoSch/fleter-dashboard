__dot\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__addr\">Av. Belgrano 1250<\u002Fp><p class=\"route-stops__loc\">Avellaneda<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--parada\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop route-stops__stop--paradas\"><p class=\"route-stops__paradas\">1 parada<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--destino\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__addr\">Panamericana km 36<\u002Fp><p class=\"route-stops__loc\">Garín<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"trip-row__cell trip-row__cond\" data-label=\"Condiciones\">Con hidrogrúa<\u002Fdiv><div class=\"trip-row__cell trip-row__dist\" data-label=\"Distancia · tiempo\"><strong>64 km<\u002Fstrong>1 h 58<\u002Fdiv><div class=\"trip-row__cell trip-row__price\" data-label=\"Precio\">$56.100<small>final<\u002Fsmall><\u002Fdiv><div class=\"trip-row__cell trip-row__status\" data-label=\"Estado\"><span class=\"status FINALIZADO\">Entregado<\u002Fspan><\u002Fdiv><span class=\"trip-row__chevron\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa><\u002Fdiv>\n<div style=\"display:flex;gap:16px;flex-wrap:wrap\"><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.trips-table · .trip-row[.is-selected] · .trip-row__cell[data-label]<\u002Fcode><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">__meta __route __cond __dist __price __status<\u002Fcode><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.route-stops__paradas[.is-empty] · &lt; 1080: cards con etiquetas<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<p style=\"font-size:13px;color:var(--ink-2);margin:0;line-height:1.55;max-width:760px\">En desktop la fila es una grilla de siete columnas con encabezado. Por debajo de 1080 px se vuelve una card con cada dato etiquetado (<code style=\"font-family:var(--font-mono)\">data-label<\u002Fcode>), y en mobile las etiquetas se reordenan en dos columnas. Nunca hay scroll horizontal.<\u002Fp>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption class=\"field__label\">Dashboard · lista de viajes con los 9 datos<\u002Ffigcaption><img src=\"5f2bb843-9ac7-4398-a8e1-db0a7172f234\" alt=\"Dashboard · lista de viajes con los 9 datos\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius);display:block\"><\u002Ffigure>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Se abre al tocar una fila (drawer de 580 px; pantalla completa en mobile). Paradas una por una, condiciones completas, mapa, estimado vs. real y línea de tiempo de estados.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start\">\n<div class=\"stack\"><div class=\"card card--ink\" style=\"display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap\"><div><p class=\"kpi__label\" style=\"color:var(--on-ink-2)\">Precio estimado<\u002Fp><p class=\"price price--md\" style=\"margin:6px 0 0\">$48.200<\u002Fp><\u002Fdiv><dl class=\"kv\" style=\"font-size:12.5px;gap:4px 14px\"><dt style=\"color:var(--on-ink-2)\">Vehículo<\u002Fdt><dd>Camión chico · Flota propia<\u002Fdd><dt style=\"color:var(--on-ink-2)\">Conductor<\u002Fdt><dd>Diego Herrera · AE 421 KL<\u002Fdd><\u002Fdl><\u002Fdiv>\n<section class=\"drawer__section\"><h3 class=\"drawer__section-title\">Recorrido <span>2 paradas<\u002Fspan><\u002Fh3><div class=\"route-stops route-stops--grande\"><div class=\"route-stops__marker\"><i class=\"route-stops__dot \"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__n\">Origen<\u002Fp><p class=\"route-stops__addr\">Av. Belgrano 1250<\u002Fp><p class=\"route-stops__loc\">Avellaneda<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--parada\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__n\">Parada 1<\u002Fp><p class=\"route-stops__addr\">Av. Hipólito Yrigoyen 3900<\u002Fp><p class=\"route-stops__loc\">Lanús<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--parada\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__n\">Parada 2<\u002Fp><p class=\"route-stops__addr\">Colectora Panamericana 2100<\u002Fp><p class=\"route-stops__loc\">Don Torcuato<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--destino\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__n\">Destino<\u002Fp><p class=\"route-stops__addr\">Ruta 8 km 52<\u002Fp><p class=\"route-stops__loc\">Pilar<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section class=\"drawer__section\"><h3 class=\"drawer__section-title\">Condiciones de carga<\u002Fh3><dl class=\"cond\"><div class=\"cond__item\"><dt>Frágil<\u002Fdt><dd>Perfiles de aluminio anodizado; no apilar más de dos pallets.<\u002Fdd><\u002Fdiv><div class=\"cond__item\"><dt>Con hidrogrúa<\u002Fdt><dd>La descarga en Pilar necesita hidrogrúa; el depósito no tiene autoelevador.<\u002Fdd><\u002Fdiv><\u002Fdl><p class=\"cond__empty\">Sin condiciones. La carga viaja sin requisitos especiales.<\u002Fp><\u002Fsection><\u002Fdiv>\n<div class=\"stack\"><section class=\"drawer__section\"><h3 class=\"drawer__section-title\">Mapa<\u002Fh3><div class=\"mapa\" style=\"height:150px\"><svg viewBox=\"0 0 560 210\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M70 150 C 150 40, 230 175, 310 110 S 440 30, 490 72\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"70\" cy=\"150\" r=\"7\" fill=\"var(--accent)\" stroke=\"var(--surface)\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"230\" cy=\"128\" r=\"5\" fill=\"var(--ink-3)\" stroke=\"var(--surface)\" stroke-width=\"2.5\"><\u002Fcircle><rect x=\"483\" y=\"65\" width=\"14\" height=\"14\" rx=\"2\" fill=\"var(--ink)\" stroke=\"var(--surface)\" stroke-width=\"3\"><\u002Frect><\u002Fsvg><span class=\"mapa__label\">Mapa en vivo · lo carga el proveedor de mapas<\u002Fspan><\u002Fdiv><\u002Fsection>\n<section class=\"drawer__section\"><h3 class=\"drawer__section-title\">Estimado y real<\u002Fh3><dl class=\"comparativa\"><div><\u002Fdiv><div class=\"comparativa__head\">Estimado<\u002Fdiv><div class=\"comparativa__head\">Real<\u002Fdiv><dt>Distancia<\u002Fdt><dd class=\"is-estimado\">52 km<\u002Fdd><dd>A confirmar<\u002Fdd><dt>Tiempo<\u002Fdt><dd class=\"is-estimado\">1 h 40<\u002Fdd><dd>A confirmar<\u002Fdd><dt>Precio<\u002Fdt><dd class=\"is-estimado\">$48.200<\u002Fdd><dd>A confirmar<\u002Fdd><dt>Llegada<\u002Fdt><dd class=\"is-estimado\">16:10<\u002Fdd><dd>A confirmar<\u002Fdd><\u002Fdl><\u002Fsection>\n<section class=\"drawer__section\"><h3 class=\"drawer__section-title\">Línea de tiempo<\u002Fh3><ol class=\"timeline\"><li class=\"timeline__item is-done\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">Buscando conductor<\u002Fp><span class=\"timeline__time\">12:02<\u002Fspan><\u002Fli><li class=\"timeline__item is-done\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">Conductor asignado<\u002Fp><span class=\"timeline__time\">12:09<\u002Fspan><\u002Fli><li class=\"timeline__item is-done\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">En camino al origen<\u002Fp><span class=\"timeline__time\">13:48<\u002Fspan><\u002Fli><li class=\"timeline__item is-done\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">Cargando<\u002Fp><span class=\"timeline__time\">14:31<\u002Fspan><\u002Fli><li class=\"timeline__item is-current\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">En ruta<\u002Fp><span class=\"timeline__time\">15:05<\u002Fspan><\u002Fli><li class=\"timeline__item is-pending\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">Descargando<\u002Fp><span class=\"timeline__time\">a confirmar<\u002Fspan><\u002Fli><li class=\"timeline__item is-pending\"><div class=\"timeline__marker\"><i class=\"timeline__dot\"><\u002Fi><i class=\"timeline__line\"><\u002Fi><\u002Fdiv><p class=\"timeline__label\">Entregado · remito conformado<\u002Fp><span class=\"timeline__time\">est. 16:10<\u002Fspan><\u002Fli><\u002Fol><\u002Fsection>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\"><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.drawer · __head __body __section __foot<\u002Fcode><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.route-stops--grande · .cond · .comparativa · .timeline · .mapa<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption class=\"field__label\">Dashboard · detalle abierto al tocar un viaje (drawer de 580 px)<\u002Ffigcaption><img src=\"870c64e6-18c1-4734-98b0-706d11efced2\" alt=\"Dashboard · detalle abierto al tocar un viaje (drawer de 580 px)\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius);display:block\"><\u002Ffigure>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\"><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Cómo se abre<\u002Fstrong><span>Click en cualquier parte de la fila (o en el banner del viaje activo). Se abre un drawer de 580 px a la derecha, con fondo oscurecido; Esc o el fondo lo cierran. En mobile ocupa toda la pantalla. La fila abierta queda marcada con <code style=\"font-family:var(--font-mono)\">.is-selected<\u002Fcode>.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Qué muestra<\u002Fstrong><span>Precio grande con su nota (estimado, final o sin cargo), vehículo y conductor, recorrido parada por parada con su dirección, mapa, condiciones completas con su descripción, tabla «Estimado y real» (distancia, tiempo, precio, llegada) y línea de tiempo de estados con hora real, hora estimada o «a confirmar».<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Si terminó o se canceló<\u002Fstrong><span>Entregado: la columna Real se completa y el botón principal es «Ver remito conformado». Cancelado: nota roja con el motivo, la columna Real dice «No aplica» y la línea de tiempo termina en un punto rojo con la hora de cancelación.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"graficos\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">09<\u002Fp><h2>Gráficos<\u002Fh2><p>Regla 3. Un solo componente, <code style=\"font-family:var(--font-mono)\">.chart<\u002Fcode>, para todo gráfico de barras.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Ningún gráfico es decorativo: grilla horizontal, eje Y con valor y unidad en cada línea, eje X legible, valor exacto al pasar el mouse (o con Tab) y leyenda si hay más de una serie.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\"><div class=\"card\"><div class=\"card-head\"><div><h3 class=\"card-title\">Gasto por semana<\u002Fh3><p class=\"card-sub\">En pesos<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"chart\" style=\"--chart-h:150px\"><div class=\"chart__plot\"><div class=\"chart__gridline\" style=\"bottom:0%\"><span>$0<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:25%\"><span>$150.000<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:50%\"><span>$300.000<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:75%\"><span>$450.000<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:100%\"><span>$600.000<\u002Fspan><\u002Fdiv><div class=\"chart__bars\"><div class=\"chart__group\"><div class=\"chart__bar chart__bar--accent\" style=\"height:85.38333333333334%\" tabindex=\"0\" aria-label=\"1–7 sep · Gasto: $512.300\"><span class=\"chart__tip\">1–7 sep · Gasto: $512.300<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"chart__group\"><div class=\"chart__bar chart__bar--accent\" style=\"height:91.48333333333333%\" tabindex=\"0\" aria-label=\"8–14 sep · Gasto: $548.900\"><span class=\"chart__tip\">8–14 sep · Gasto: $548.900<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"chart__group\"><div class=\"chart__bar chart__bar--accent\" style=\"height:37.21666666666666%\" tabindex=\"0\" aria-label=\"15–21 sep · Gasto: $223.300\"><span class=\"chart__tip\">15–21 sep · Gasto: $223.300<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"chart__x\"><span>1–7 sep<\u002Fspan><span>8–14 sep<\u002Fspan><span>15–21 sep<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div class=\"card-head\"><div><h3 class=\"card-title\">Viajes por semana<\u002Fh3><p class=\"card-sub\">Cantidad<\u002Fp><\u002Fdiv><div class=\"leyenda\"><span class=\"leyenda__item\"><i class=\"leyenda__swatch\"><\u002Fi>Propia<\u002Fspan><span class=\"leyenda__item\"><i class=\"leyenda__swatch leyenda__swatch--accent\"><\u002Fi>Verificados<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"chart\" style=\"--chart-h:150px\"><div class=\"chart__plot\"><div class=\"chart__gridline\" style=\"bottom:0%\"><span>0 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:25%\"><span>3 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:50%\"><span>6 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:75%\"><span>9 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__gridline\" style=\"bottom:100%\"><span>12 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__bars\"><div class=\"chart__group\"><div class=\"chart__bar \" style=\"height:75%\" tabindex=\"0\" aria-label=\"1–7 sep · Flota propia: 9 viajes\"><span class=\"chart__tip\">1–7 sep · Flota propia: 9 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__bar chart__bar--accent\" style=\"height:41.66666666666667%\" tabindex=\"0\" aria-label=\"1–7 sep · Verificados: 5 viajes\"><span class=\"chart__tip\">1–7 sep · Verificados: 5 viajes<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"chart__group\"><div class=\"chart__bar \" style=\"height:83.33333333333334%\" tabindex=\"0\" aria-label=\"8–14 sep · Flota propia: 10 viajes\"><span class=\"chart__tip\">8–14 sep · Flota propia: 10 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__bar chart__bar--accent\" style=\"height:41.66666666666667%\" tabindex=\"0\" aria-label=\"8–14 sep · Verificados: 5 viajes\"><span class=\"chart__tip\">8–14 sep · Verificados: 5 viajes<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"chart__group\"><div class=\"chart__bar \" style=\"height:41.66666666666667%\" tabindex=\"0\" aria-label=\"15–21 sep · Flota propia: 5 viajes\"><span class=\"chart__tip\">15–21 sep · Flota propia: 5 viajes<\u002Fspan><\u002Fdiv><div class=\"chart__bar chart__bar--accent\" style=\"height:25%\" tabindex=\"0\" aria-label=\"15–21 sep · Verificados: 3 viajes\"><span class=\"chart__tip\">15–21 sep · Verificados: 3 viajes<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"chart__x\"><span>1–7 sep<\u002Fspan><span>8–14 sep<\u002Fspan><span>15–21 sep<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:12px\"><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.chart[--chart-h,--chart-y-w] · __plot · __gridline&gt;span · __bars · __group · __bar[--accent|--ink-2] · __tip · __x<\u002Fcode><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.leyenda · __item · __swatch<\u002Fcode><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">escala() y grafico() en kits/web/viajes-data.js<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\"><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Lo obligatorio<\u002Fstrong><span>Cinco líneas de grilla en <code style=\"font-family:var(--font-mono)\">--line-strong<\u002Fcode> (la base incluida). Cada línea lleva su valor con unidad en mono: «$400.000», «12 viajes», «60 km». Eje X con etiquetas completas («1–7 sep», «lun 14», «CABA»). Al pasar el mouse o tabular a una barra aparece el valor exacto con su serie.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Escala<\u002Fstrong><span><code style=\"font-family:var(--font-mono)\">escala(max, entero)<\u002Fcode> en <code style=\"font-family:var(--font-mono)\">kits/web/viajes-data.js<\u002Fcode> elige un techo redondo dividido en cuatro: pasos 1 · 2 · 2,5 · 3 · 5 por potencia de diez, y sólo enteros cuando la unidad son viajes. Las unidades distintas van en gráficos distintos: pesos y viajes nunca comparten eje.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Series y leyenda<\u002Fstrong><span>Una serie: barra en <code style=\"font-family:var(--font-mono)\">--accent<\u002Fcode> (pesos) o <code style=\"font-family:var(--font-mono)\">--ink-3<\u002Fcode> (comparaciones). Dos series: tinta + naranja, y la leyenda va en el encabezado de la card con <code style=\"font-family:var(--font-mono)\">.leyenda<\u002Fcode>. Nada de degradados, sombras ni barras redondeadas más que 3 px arriba.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"responsive\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">10<\u002Fp><h2>Responsive<\u002Fh2><p>Mobile &lt; 720 · Tablet 720–1079 · Desktop ≥ 1080. Las reglas viven en components.css; ninguna pantalla agrega media queries propias.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink-2);columns:2;column-gap:32px;max-width:900px\"><li>Sidebar 248 → riel 64 (sólo íconos, 44 px de alto) → barra inferior de 5 ítems con «Pedir» destacado.<\u002Fli><li>Grilla de 12: span-3/4 pasan a 6 en tablet; todo a 12 en mobile.<\u002Fli><li>Lista de viajes: grilla con encabezado en desktop; cards con los 9 datos etiquetados por debajo de 1080.<\u002Fli><li>Drawer del detalle: 580 px en desktop y tablet; pantalla completa en mobile.<\u002Fli><li>Gráficos: el eje Y se angosta a 60 px en mobile; las barras y etiquetas se reparten el ancho.<\u002Fli><li>Formularios: dos columnas → una. Los botones de acción ocupan todo el ancho.<\u002Fli><li>Popovers de fecha → hoja inferior con fondo. Rango muestra un solo mes bajo 1080.<\u002Fli><li>Auth: el aside oscuro desaparece; el logo aparece arriba del formulario.<\u002Fli><\u002Ful><\u002Fsection>\n\n<section id=\"pantallas\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">11<\u002Fp><h2>Pantallas<\u002Fh2><p>Kits armados sólo con clases del sistema, capturados en ancho tablet (riel de íconos). Los archivos vivos están en kits/web/.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\"><div class=\"span-6\"><figure class=\"card stack stack--tight\" style=\"margin:0\"><img src=\"b4ea8286-793e-4ac8-a63b-d5acc3fb9b86\" alt=\"Login\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);display:block\"><figcaption><strong style=\"font-size:14px;display:block\">Login<\u002Fstrong><span class=\"muted\" style=\"font-size:12px\">Auth split con eslogan · error inline · estado cargando<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fdiv><div class=\"span-6\"><figure class=\"card stack stack--tight\" style=\"margin:0\"><img src=\"0acf1e71-c046-4f38-b26b-10dc79c50048\" alt=\"Dashboard del cliente\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);display:block\"><figcaption><strong style=\"font-size:14px;display:block\">Dashboard del cliente<\u002Fstrong><span class=\"muted\" style=\"font-size:12px\">SelectorPeriodo · KPI · tres gráficos con grilla · viajes con detalle<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fdiv><div class=\"span-6\"><figure class=\"card stack stack--tight\" style=\"margin:0\"><img src=\"634a7c86-0c3c-46bb-9ea9-15f83a81167c\" alt=\"Pedir viaje\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);display:block\"><figcaption><strong style=\"font-size:14px;display:block\">Pedir viaje<\u002Fstrong><span class=\"muted\" style=\"font-size:12px\">FechaPicker con hora · option cards · resumen fijo<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fdiv><div class=\"span-6\"><figure class=\"card stack stack--tight\" style=\"margin:0\"><img src=\"312fc7d0-b76a-4cd9-8a6b-77898f90a32b\" alt=\"Admin · Viajes\" style=\"width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);display:block\"><figcaption><strong style=\"font-size:14px;display:block\">Admin · Viajes<\u002Fstrong><span class=\"muted\" style=\"font-size:12px\">RangoPicker con atajos · filtros · ocho viajes en todos los estados, con detalle<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"implementacion\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">12<\u002Fp><h2>Implementación<\u002Fh2><p>Qué va a <code style=\"font-family:var(--font-mono)\">app/globals.css<\u002Fcode> y cómo se usa.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.6;color:var(--ink-2)\"><div class=\"card span-6 stack stack--tight\"><strong style=\"color:var(--ink)\">1 · Tokens<\u002Fstrong><span>Pegá <code style=\"font-family:var(--font-mono)\">tokens/colors.css<\u002Fcode>, <code style=\"font-family:var(--font-mono)\">dark.css<\u002Fcode>, <code style=\"font-family:var(--font-mono)\">typography.css<\u002Fcode> y <code style=\"font-family:var(--font-mono)\">spacing.css<\u002Fcode> al principio de globals.css, reemplazando el <code style=\"font-family:var(--font-mono)\">:root<\u002Fcode> actual. Los nombres existentes (--accent, --ink, --line, --surface-2…) se mantienen; se agregan los <code style=\"font-family:var(--font-mono)\">*-ink<\u002Fcode>, los de estado y los de layout.<\u002Fspan><\u002Fdiv><div class=\"card span-6 stack stack--tight\"><strong style=\"color:var(--ink)\">2 · Componentes<\u002Fstrong><span>Después van las clases de <code style=\"font-family:var(--font-mono)\">components.css<\u002Fcode>. Las que ya existían (.btn, .status, .card, .field, .nav-item, .trip-row…) reemplazan a las viejas; las nuevas (.fecha, .rango, .cal, .tabbar, .option-card, .toast, .chart, .drawer, .timeline, .comparativa, .cond, .mapa) se suman. Los estilos inline del código se van borrando pantalla por pantalla.<\u002Fspan><\u002Fdiv><div class=\"card span-6 stack stack--tight\"><strong style=\"color:var(--ink)\">3 · Selector de fecha y datos del viaje<\u002Fstrong><span><code style=\"font-family:var(--font-mono)\">components/SelectorFecha.jsx<\u002Fcode> es React sin dependencias: se porta a TSX tal cual (tipos en <code style=\"font-family:var(--font-mono)\">SelectorFecha.d.ts<\u002Fcode>). <code style=\"font-family:var(--font-mono)\">kits/web/viajes-data.js<\u002Fcode> tiene <code style=\"font-family:var(--font-mono)\">fila(viaje)<\u002Fcode> y <code style=\"font-family:var(--font-mono)\">detalle(viaje)<\u002Fcode>: el modelo de vista de los 9 datos y del drawer, con los textos «A confirmar», «Sin paradas» y «Sin condiciones» resueltos en un solo lugar.<\u002Fspan><\u002Fdiv><div class=\"card span-6 stack stack--tight\"><strong style=\"color:var(--ink)\">4 · Convenciones<\u002Fstrong><span>BEM estricto: <code style=\"font-family:var(--font-mono)\">bloque__elemento<\u002Fcode>, <code style=\"font-family:var(--font-mono)\">bloque--modificador<\u002Fcode>, estados <code style=\"font-family:var(--font-mono)\">is-active / is-selected / is-disabled / is-invalid / is-open / is-done / is-pending<\u002Fcode>. Ningún color hexadecimal fuera de tokens. Un botón primario por vista. Texto chico sobre naranja siempre en <code style=\"font-family:var(--font-mono)\">--on-accent<\u002Fcode>. Y las tres reglas del principio.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"card card--ink\" style=\"font-family:var(--font-mono);font-size:12px;line-height:1.7;white-space:pre;overflow:auto\">styles.css              importa todo, en orden\ntokens/fonts.css        Google Fonts (en el repo: next/font)\ntokens/colors.css       marca, neutros, semánticos, estados, zonas\ntokens/dark.css         [data-theme=\"dark\"]\ntokens/typography.css   familias, escala, pesos\ntokens/spacing.css      escala, radios, sombras, layout, breakpoints\ncomponents.css          BEM + responsive (incluye .chart, .drawer, .timeline)\ncomponents/SelectorFecha.jsx  FechaPicker · RangoPicker · SelectorPeriodo\nkits/web/viajes-data.js       datos de ejemplo · fila() · detalle() · escala() · grafico()\nassets/logo/            isotipo, ícono de app, lockups\nversiones/v1/           copia congelada anterior a las 3 reglas<\u002Fdiv><\u002Fsection>\n<\u002Fmain><\u002Fdiv><\u002Fbody><\u002Fhtml>"
  </script>
