document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

8-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"34326edd-b936-44fd-8e5f-20fbb45a7bfb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f07e7cf5-dba8-406c-8d79-fbaef8128e1c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Fleter — color. Base: app/globals.css (:root). Cambios respecto del repo:\n   - --ink-2 / --ink-3 más oscuros para cumplir AA en texto chico sobre --bg y --surface-2.\n   - Nuevos *-ink por cada semántico: el color \"apto para texto chico\" sobre su fondo soft.\n   - --on-accent: sobre naranja el texto chico va en tinta; el blanco (--on-accent-large)\n     queda sólo para texto grande (≥19 px bold o ≥24 px), donde 3.5:1 cumple AA.\n   El naranja #E85D2A no se toca. */\n:root {\n  /* Marca */\n  --brand-orange: #E85D2A;\n  --accent: #E85D2A;          /* rellenos, marcadores, énfasis */\n  --accent-hover: #F06A38;    /* hover de botón primario (más claro, mantiene 5.6:1 con tinta) */\n  --accent-press: #D2521F;    /* pressed */\n  --accent-ink: #A63B14;      /* naranja para texto chico sobre claro (6.4:1) y sobre --accent-soft (5.3:1) */\n  --accent-soft: #FBE4D6;     /* fondo suave */\n  --accent-softer: #FFF1E7;   /* fondo apenas teñido */\n  --on-accent: #1B1A17;       /* texto chico e íconos sobre --accent (4.9:1) */\n  --on-accent-large: #FFFFFF; /* sólo texto grande sobre --accent: ≥19 px bold o ≥24 px (3.5:1, AA large) */\n\n  /* Fondos */\n  --bg: #FAF7F1;              /* fondo de app (off-white cálido) */\n  --surface: #FFFFFF;         /* cards, paneles */\n  --surface-2: #F2EDE2;       /* sidebar, zonas hundidas */\n  --surface-3: #ECE9E1;       /* hover */\n  --surface-ink: #1B1A17;     /* card--ink, aside de auth */\n\n  /* Líneas */\n  --line: #E8E4DA;\n  --line-strong: #D9D3C5;\n\n  /* Tinta */\n  --ink: #1B1A17;             /* texto principal */\n  --ink-2: #3F3B34;           /* secundario */\n  --ink-3: #665F50;           /* metadata, labels (4.7:1 sobre --surface-2) */\n  --ink-4: #B8B2A2;           /* deshabilitado, decorativo. Nunca texto informativo */\n  --on-ink: #FFFFFF;          /* texto sobre --surface-ink */\n  --on-ink-2: rgba(255,255,255,.72);\n\n  /* Semánticos: base (íconos, puntos, texto grande) · ink (texto chico) · soft (fondo) */\n  --ok: #2F8F4E;    --ok-ink: #1F6B39;    --ok-soft: #DCEFD8;\n  --warn: #C98A12;  --warn-ink: #8A5E0B;  --warn-soft: #FBEFCE;\n  --err: #B83232;   --err-ink: #9C2626;   --err-soft: #F5D9D4;\n  --info: #2E6FB7;  --info-ink: #22578F;  --info-soft: #D8E4F2;\n\n  /* Estados del viaje (lib/estados.ts) agrupados por familia */\n  --estado-buscando-bg: var(--warn-soft);   --estado-buscando-fg: var(--warn-ink);    /* BUSCANDO_CONDUCTOR */\n  --estado-proximo-bg: var(--info-soft);    --estado-proximo-fg: var(--info-ink);     /* RESERVADO_POR_EMPRESA, CONDUCTOR_ASIGNADO */\n  --estado-en-curso-bg: var(--accent-soft); --estado-en-curso-fg: var(--accent-ink);  /* EN_CAMINO_A_ORIGEN, CARGANDO, EN_RUTA, DESCARGANDO */\n  --estado-entregado-bg: var(--ok-soft);    --estado-entregado-fg: var(--ok-ink);     /* FINALIZADO */\n  --estado-cancelado-bg: var(--err-soft);   --estado-cancelado-fg: var(--err-ink);    /* CANCELADO */\n\n  /* Zonas */\n  --zona-caba-bg: var(--info-soft);   --zona-caba-fg: var(--info-ink);\n  --zona-prov-bg: #EEEAE0;            --zona-prov-fg: var(--ink-2);\n  --zona-mixto-bg: var(--warn-soft);  --zona-mixto-fg: var(--warn-ink);\n\n  /* Recorrido: origen y destino */\n  --marcador-origen: var(--accent);   /* círculo */\n  --marcador-destino: var(--ink);     /* cuadrado */\n  --marcador-parada: var(--ink-3);\n\n  /* Foco */\n  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);\n}\n\n/* Tema oscuro (hereda de la app mobile del conductor). Se activa con\n   data-theme=\"dark\" en <html> o en cualquier contenedor. Los tokens\n   semánticos cambian; el naranja de marca y --on-accent no. */\n[data-theme=\"dark\"] {\n  --accent-hover: #F06A38;\n  --accent-press: #D2521F;\n  --accent-ink: #F0865A;      /* naranja para texto chico sobre oscuro (6.8:1) */\n  --accent-soft: #3B2116;\n  --accent-softer: #2A1B13;\n  --on-accent: #1B1A17;\n  --on-accent-large: #FFFFFF;\n\n  --bg: #141310;\n  --surface: #1C1A16;\n  --surface-2: #23201B;\n  --surface-3: #2B2822;\n  --surface-ink: #F4F0E7;\n\n  --line: #2E2A24;\n  --line-strong: #3B362E;\n\n  --ink: #F4F0E7;\n  --ink-2: #CBC5B8;\n  --ink-3: #9E978A;\n  --ink-4: #6B655A;\n  --on-ink: #141310;\n  --on-ink-2: rgba(20,19,16,.72);\n\n  --ok: #4DB36E;    --ok-ink: #7BD397;    --ok-soft: #16301F;\n  --warn: #D9A23A;  --warn-ink: #E9BC5C;  --warn-soft: #33260A;\n  --err: #D95454;   --err-ink: #F09090;   --err-soft: #3A1717;\n  --info: #5C93D6;  --info-ink: #8DB8EC;  --info-soft: #14243A;\n\n  --zona-prov-bg: #2B2822;\n\n  --marcador-destino: var(--ink);\n  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);\n}\n\n/* Fleter — tipografía. Cuatro familias, cada una con un rol fijo:\n   Archivo Black = display y números · Manrope = UI · Josefin Sans = eyebrows y eslogan ·\n   JetBrains Mono = IDs, patentes, horas. */\n:root {\n  --font-display: \"Archivo Black\", \"Arial Black\", sans-serif;\n  --font-ui: \"Manrope\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-accent: \"Josefin Sans\", \"Manrope\", sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, Menlo, monospace;\n\n  /* Display (Archivo Black, peso único 400) */\n  --text-display-xl: 44px;   /* precio del viaje */\n  --text-display-lg: 32px;   /* valor de KPI */\n  --text-display-md: 28px;   /* título de sección (h2) */\n  --text-display-sm: 17px;   /* título de estado vacío */\n  --text-display-xs: 14px;   /* título de card */\n\n  /* UI (Manrope) */\n  --text-lg: 16px;\n  --text-md: 14px;           /* body */\n  --text-sm: 13px;           /* nav, celdas */\n  --text-xs: 12px;           /* metadata, hints */\n  --text-2xs: 11px;          /* badges, tags uppercase (mínimo del sistema) */\n\n  /* Eyebrow (Josefin Sans, uppercase) */\n  --text-eyebrow: 12px;\n  --tracking-eyebrow: 0.10em;\n\n  /* Mono */\n  --text-mono: 12px;\n  --text-mono-lg: 18px;      /* N° de viaje destacado */\n  --tracking-patente: 0.08em;\n\n  --leading-tight: 1.05;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --tracking-display: -0.02em;\n  --tracking-label: 0.06em;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n}\n\n/* Fleter — espaciado, radios, sombras, layout, breakpoints, movimiento. */\n:root {\n  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;\n  --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;\n\n  --radius-sm: 6px;          /* inputs, chips, badges */\n  --radius: 10px;            /* cards, botones grandes */\n  --radius-lg: 14px;         /* popovers, íconos de estado vacío */\n  --radius-pill: 999px;\n\n  --shadow-card: 0 1px 0 rgba(27,26,23,.04), 0 1px 2px rgba(27,26,23,.04);\n  --shadow-pop: 0 8px 28px rgba(27,26,23,.10), 0 2px 6px rgba(27,26,23,.06);\n\n  /* Controles */\n  --control-h: 36px;         /* btn, input, chip grande */\n  --control-h-lg: 44px;      /* btn--lg, inputs de auth, mínimo táctil */\n  --control-h-sm: 28px;      /* period-tab, chip */\n  --tap-min: 44px;\n  --card-pad: 18px;\n  --card-pad-form: 22px 26px;\n\n  /* Layout */\n  --sidebar-w: 248px;\n  --sidebar-rail-w: 64px;    /* tablet: sólo íconos */\n  --tabbar-h: 64px;          /* mobile: barra inferior */\n  --topbar-pad: 14px 28px;\n  --content-pad: 24px 28px 48px;\n  --content-pad-tablet: 20px 20px 48px;\n  --content-pad-mobile: 16px 16px 96px;\n  --page-narrow: 560px;\n  --page-medium: 840px;\n  --page-wide: 1000px;\n  --grid-gap: 16px;\n\n  /* Breakpoints (documentales: CSS no admite var() en @media).\n     mobile < 720 · tablet 720–1079 · desktop ≥ 1080 */\n  --bp-tablet: 720px;\n  --bp-desktop: 1080px;\n\n  /* Movimiento */\n  --ease: cubic-bezier(.2,.7,.2,1);\n  --dur-fast: 120ms;\n  --dur: 180ms;\n  --dur-slow: 260ms;\n}\n\n/* Fleter — componentes BEM. Todo sale de tokens (tokens/*.css). Clases: bloque__elemento,\n   bloque--modificador, estados is-active / is-selected / is-disabled / is-invalid.\n   Los nombres coinciden con app/globals.css donde ya existían. */\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:var(--text-md);line-height:var(--leading-normal);-webkit-font-smoothing:antialiased}\na{color:var(--accent-ink)}a:hover{color:var(--accent)}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:none;box-shadow:var(--focus-ring)}\n@keyframes fl-pulse{0%,100%{opacity:1}50%{opacity:.35}}\n@keyframes fl-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}\n@keyframes fl-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@keyframes fl-spin{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* ---- Marca ---- */\n.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}\n.brand-mark{width:28px;height:28px;flex:none;display:block}\n.brand-name{font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;line 4px;position:sticky;top:0;height:100vh;overflow:auto}\n.brand-header{display:flex;align-items:center;gap:10px;padding:2px 6px}\n.sidebar__new{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}\n.sidebar__new:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.sidebar__new-plus{font-size:16px;line-height:1;width:16px;text-align:center}\n.sidebar__nav{display:flex;flex-direction:column;gap:2px}\n.sidebar__nav--grow{flex:1}\n.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px;font-weight:500;text-decoration:none;border:0;background:none;width:100%;cursor:pointer;text-align:left}\n.nav-item:hover{background:var(--surface-3);color:var(--ink)}\n.nav-item.is-active{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}\n.nav-item__icon{width:16px;height:16px;flex:none;color:var(--ink-3)}\n.nav-item.is-active .nav-item__icon{color:var(--accent)}\n.nav-item__label{flex:1;white-space:nowrap}\n.nav-item__badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--radius-pill);background:var(--surface-3);color:var(--ink-2)}\n.nav-item.is-active .nav-item__badge{background:var(--accent-soft);color:var(--accent-ink)}\n.nav-item__suffix{font-size:11px;color:var(--ink-3)}\n.nav-item--disabled{color:var(--ink-4);cursor:default;pointer-events:none}\n.nav-item--disabled .nav-item__icon{color:var(--ink-4)}\n.nav-item__live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:fl-pulse 1.6s var(--ease) infinite}\n.sidebar__recent{display:flex;flex-direction:column;gap:1px}\n.sidebar__recent-title{font-size:11px;font-weight:600;letter-spacing:.06em;t cals .cal:last-child{display:none}\n  .cal{width:100%}\n  .cal__day{height:44px}\n  .hora__pop{max-height:200px}\n  .auth-split{grid-template-columns:minmax(0,1fr)}\n  .auth-split__aside{display:none}\n  .auth-split__mobile-brand{display:flex;justify-content:center;margin-bottom:28px}\n  .auth-split__main{padding:28px 20px 40px;align-items:flex-start}\n  .auth-title{font-size:26px}\n  .toast-stack{left:16px;right:16px;transform:none;bottom:calc(var(--tabbar-h) + 12px)}\n  .toast{width:100%}\n  .empty-state{padding:28px 18px}\n}\n@keyframes fl-sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}\n\n<\u002Fstyle>\n<style>.doc-card{padding:16px;font-size:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);overflow:hidden}.doc-card .row{display:flex;gap:8px}.doc-card .sw{flex:1;min-width:0}.doc-card .sw i{display:block;height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}.doc-card .sw b{display:block;margin-top:6px;font-size:11.5px;font-weight:600}.doc-card .sw code{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}.doc-nav .nav-item{height:32px;font-size:13px}@media (max-width:719px){.doc-shell{grid-template-columns:minmax(0,1fr)!important}.doc-nav{display:none}.doc-main{padding:24px 18px 64px!important}}<\u002Fstyle>\n\n<\u002Fhead><body>\n<div class=\"doc-shell\" style=\"display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh\">\n<nav class=\"doc-nav\" style=\"position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:18px\">\n<a class=\"brand\" href=\"#top\"><img class=\"brand-mark\" src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" alt=\"\"><span class=\"brand-name\">Fleter<em>.<\u002Fem><\u002Fspan><\u002Fa>\n<div class=\"sidebar__nav\"><a class=\"nav-item\" href=\"#reglas\"><span class=\"nav-item__label\">Reglas del proyecto<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#marca\"><span class=\"nav-item__label\">Marca<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#color\"><span class=\"nav-item__label\">Color<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#tipografia\"><span class=\"nav-item__label\">Tipografía<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#espaciado\"><span class=\"nav-item__label\">Espaciado y layout<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#componentes\"><span class=\"nav-item__label\">Componentes<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#fecha\"><span class=\"nav-item__label\">Selector de fecha<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#estados\"><span class=\"nav-item__label\">Estados del viaje<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#viaje\"><span class=\"nav-item__label\">El viaje: 9 datos y detalle<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#graficos\"><span class=\"nav-item__label\">Gráficos<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#responsive\"><span class=\"nav-item__label\">Responsive<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#pantallas\"><span class=\"nav-item__label\">Pantallas<\u002Fspan><\u002Fa><a class=\"nav-item\" href=\"#implementacion\"><span class=\"nav-item__label\">Implementación<\u002Fspan><\u002Fa><\u002Fdiv>\n<p class=\"muted\" style=\"font-size:11px;margin-top:auto;line-height:1.5\">v2 · septiembre 2026<br>Versión sin conexión<\u002Fp><\u002Fnav>\n<main class=\"doc-main\" id=\"top\" style=\"padding:40px 48px 96px;max-width:1060px;display:flex;flex-direction:column;gap:64px\">\n<header class=\"stack\" style=\"gap:18px\"><p class=\"eyebrow eyebrow--accent\">Sistema de diseño · web<\u002Fp><h1 style=\"font-family:var(--font-display);font-size:44px;letter-spacing:-0.02em;line-height:1.05;margin:0;font-weight:400;max-width:720px\">Segura, simple, con control.<\u002Fh1><p style=\"font-size:16px;color:var(--ink-2);max-width:640px;margin:0;line-height:1.55\">Fleter administra la logística de una PyME industrial del AMBA: los viajes de su flota y los que le falten. Este documento fija marca, tokens, componentes BEM y patrones de producto para la web del cliente, del gerente y del admin. Todo lo nuevo sale de tokens; nada de estilo inline.<\u002Fp><\u002Fheader>\n\n<section id=\"reglas\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">00<\u002Fp><h2>Reglas del proyecto<\u002Fh2><p>Tres reglas que valen para toda pantalla y componente, ahora y en adelante.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.6;color:var(--ink-2)\"><div class=\"card span-4 stack stack--tight\"><p class=\"eyebrow eyebrow--accent\">Regla 1 · Vocabulario<\u002Fp><strong style=\"color:var(--ink)\">No se dice «fletes».<\u002Fstrong><span>En títulos, botones, descripciones, estados vacíos y eslogan va «logística» o se reescribe la frase con voseo natural: «Pedir viaje», «Tu logística», «Completá los datos del viaje». La marca sigue siendo Fleter. Eslogan: «Tu logística, de punta a punta».<\u002Fspan><\u002Fdiv><div class=\"card span-4 stack stack--tight\"><p class=\"eyebrow eyebrow--accent\">Regla 2 · Información del viaje<\u002Fp><strong style=\"color:var(--ink)\">Nueve datos, siempre, en cualquier estado.<\u002Fstrong><span>Origen, cantidad de paradas, destino, condiciones de carga (o «Sin condiciones»), distancia en km, tiempo estimado, precio estimado, fecha y hora, estado. Se leen de un vistazo en el listado, sin cortes. Lo que falta dice «A confirmar». Cada viaje se abre a su detalle.<\u002Fspan><\u002Fdiv><div class=\"card span-4 stack stack--tight\"><p class=\"eyebrow eyebrow--accent\">Regla 3 · Gráficos<\u002Fp><strong style=\"color:var(--ink)\">Ningún gráfico decorativo.<\u002Fstrong><span>Grilla horizontal visible, eje Y con valor y unidad ($, viajes, km) en cada línea, eje X legible, valor exacto al pasar el mouse y leyenda si hay más de una serie. Si no se puede leer cuánto vale una barra con la grilla, se rehace.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"marca\" class=\"stack\" style=\"gap:20px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">01<\u002Fp><h2>Marca<\u002Fh2><p>Isotipo «Carga», nombre en Archivo Black y eslogan en Josefin Sans.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\"><div class=\"card span-6\" style=\"display:grid;place-items:center;min-height:200px\"><a class=\"brand brand--lg\"><img class=\"brand-mark\" src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" alt=\"\"><span class=\"brand-name\">Fleter<em>.<\u002Fem><\u002Fspan><\u002Fa><\u002Fdiv><div class=\"card card--ink span-6\" style=\"display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:200px\"><a class=\"brand\" style=\"color:var(--on-ink)\"><img class=\"brand-mark\" src=\"05fbdc9d-5f91-46df-b2a7-e82bb9781532\" alt=\"\"><span class=\"brand-name\">Fleter<em>.<\u002Fem><\u002Fspan><\u002Fa><p style=\"font-family:var(--font-display);font-size:26px;letter-spacing:-0.02em;line-height:1.1;margin:0;font-weight:400\">Tu logística, <em style=\"color:var(--accent);font-style:normal\">de punta a punta.<\u002Fem><\u002Fp><\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Seis cajas estibadas forman la F. La caja oscura es la carga que se está siguiendo. Retícula de 3×3 en 48 px, módulo 10, calle 2.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"position:relative;width:144px;height:144px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center\"><div style=\"position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;background-position:-1px -1px;border-radius:10px;opacity:.9\"><\u002Fdiv><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"144\" height=\"144\" alt=\"\" style=\"position:relative\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink-3)\">Retícula 3×3 · módulo 10 · radio 2<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"96\" height=\"96\" alt=\"\"><span style=\"font-size:11px;color:var(--ink-3)\">96 · hero<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"48\" height=\"48\" alt=\"\"><span style=\"font-size:11px;color:var(--ink-3)\">48 · header<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"32\" height=\"32\" alt=\"\"><span style=\"font-size:11px;color:var(--ink-3)\">32 · sidebar<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"24\" height=\"24\" alt=\"\"><span style=\"font-size:11px;color:var(--ink-3)\">24 · mobile<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"16\" height=\"16\" alt=\"\"><span style=\"font-size:11px;color:var(--ink-3)\">16 · favicon<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center\"><img src=\"3a1e62b8-c442-4a54-b396-9985a21277ae\" width=\"56\" height=\"56\" alt=\"\" style=\"border-radius:14px\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink-3)\">Ícono de app<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center\"><img src=\"6eda109f-9879-4d67-a4eb-b700c887cf14\" width=\"56\" height=\"56\" alt=\"\" style=\"border-radius:14px\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink-3)\">Ícono alterno<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center\"><img src=\"d27192fe-53c6-4862-a41c-d6c4e30accfa\" width=\"36\" height=\"36\" alt=\"\" style=\"border-radius:0px\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink-3)\">Mono tinta<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:56px;height:56px;border-radius:14px;background:#141310;border:1px solid var(--line);display:grid;place-items:center\"><img src=\"05fbdc9d-5f91-46df-b2a7-e82bb9781532\" width=\"36\" height=\"36\" alt=\"\" style=\"border-radius:0px\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink-3)\">Sobre oscuro<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0;font-size:12px;color:var(--ink-2);line-height:1.5\">Área de respeto: un módulo (una caja) alrededor. Mínimo 16 px. Nunca rotado, nunca con sombra, nunca con degradado. La caja oscura se vuelve clara sobre fondos oscuros; el naranja no cambia.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<div class=\"grid-12\"><div class=\"span-6\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Tres posiciones probadas. Arriba a la derecha (elegida) es la punta del brazo largo: el destino. Centro y base leen como error o como falta.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px\"><div class=\"card\" style=\"padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)\"><img src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" width=\"56\" height=\"56\" alt=\"\"><strong style=\"font-size:12px\">Punta del brazo<\u002Fstrong><span style=\"font-size:11px;color:var(--ink-3);line-height:1.4\">Elegida. La carga llega al extremo: «de punta a punta».<\u002Fspan><\u002Fdiv><div class=\"card\" style=\"padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;\"><img src=\"0d593569-92fe-44a7-93af-df92f7b9e595\" width=\"56\" height=\"56\" alt=\"\"><strong style=\"font-size:12px\">Centro<\u002Fstrong><span style=\"font-size:11px;color:var(--ink-3);line-height:1.4\">Parece una pieza faltante o un error de estiba.<\u002Fspan><\u002Fdiv><div class=\"card\" style=\"padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;\"><img src=\"88c472b9-7be8-485f-b8e5-378f4f1a3629\" width=\"56\" height=\"56\" alt=\"\"><strong style=\"font-size:12px\">Base<\u002Fstrong><span style=\"font-size:11px;color:var(--ink-3);line-height:1.4\">Pesa hacia abajo; la F pierde dirección.<\u002Fspan><\u002Fdiv><div class=\"card\" style=\"padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;\"><img src=\"e66150a1-e3e9-44d4-a824-9589a0d4a746\" width=\"56\" height=\"56\" alt=\"\"><strong style=\"font-size:12px\">En contenedor oscuro<\u002Fstrong><span style=\"font-size:11px;color:var(--ink-3);line-height:1.4\">Reservado para el ícono de app y avatares. No es el logo.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><\u002Fdiv><div class=\"span-6\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">«Tu logística, de punta a punta.» Josefin Sans 600, mayúsculas, tracking .10em. Va en auth, landing y piezas de marca. No va en el sidebar ni dentro del producto.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\"><div class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;justify-content:center;height:120px\"><a class=\"brand\"><img class=\"brand-mark\" src=\"32ca69eb-ded0-49bf-a2e5-77756ccac107\" alt=\"\"><span class=\"brand-name\">Fleter<em>.<\u002Fem><\u002Fspan><\u002Fa><p class=\"eslogan\">Tu logística, de punta a punta.<\u002Fp><\u002Fdiv><div class=\"card card--ink\" style=\"display:flex;flex-direction:column;gap:10px;justify-content:center;height:120px\"><h2 style=\"font-family:var(--font-display);font-size:22px;letter-spacing:-0.02em;line-height:1.1;margin:0;font-weight:400\">Tu logística, <em style=\"color:var(--accent);font-style:normal\">de punta a punta.<\u002Fem><\u002Fh2><span style=\"font-size:11px;color:var(--ink-3)\">Versión display para el aside de auth y la landing<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;align-items:center\"><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">.eslogan<\u002Fcode><span style=\"font-size:11.5px;color:var(--ink-2)\">Sí: login, registro, landing, splash, ícono, documentos, firma de mail. &nbsp; No: sidebar, topbar, notificaciones, botones.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Ffigure><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\"><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Por qué cajas<\u002Fstrong><span>Fleter mueve carga, no camiones. La F se arma con seis cajas estibadas en una retícula de 3×3; la caja oscura es la que se está siguiendo, en la punta del brazo largo.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Dónde va el eslogan<\u002Fstrong><span>Login y registro, landing, splash e ícono, documentos y firma de mail. No va en el sidebar, la topbar ni dentro del producto.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><strong style=\"color:var(--ink)\">Archivos<\u002Fstrong><span><span style=\"font-family:var(--font-mono);font-size:11.5px\">assets/logo/isotipo.svg · isotipo-dark.svg · isotipo-mono.svg · app-icon.svg · app-icon-orange.svg · logo-horizontal.svg · -dark.svg<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Rioplatense con voseo. Directo, sin tecnicismos. Los botones dicen exactamente qué hacen.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12.5px;line-height:1.5\">\n<div class=\"stack stack--tight\"><p class=\"eyebrow\" style=\"color:var(--ok-ink)\">Así<\u002Fp><ul style=\"margin:0;padding-left:16px;color:var(--ink-2)\"><li>«Elegí una fecha» · «Completá los datos del viaje»<\u002Fli><li>«Pedir viaje» · «Confirmar viaje» · «Ver seguimiento» · «Cancelar viaje»<\u002Fli><li>«Tu pedido fue enviado. Estamos buscando un conductor.»<\u002Fli><li>«Todavía no hay viajes este mes.»<\u002Fli><li>Estados cortos y en gerundio: Buscando, Cargando, En ruta, Entregado<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"stack stack--tight\"><p class=\"eyebrow\" style=\"color:var(--err-ink)\">Así no<\u002Fp><ul style=\"margin:0;padding-left:16px;color:var(--ink-2)\"><li>«Seleccione una fecha» · «Ingrese los datos»<\u002Fli><li>«Enviar» · «Aceptar» · «OK» · «Continuar» a secas<\u002Fli><li>«Su solicitud ha sido procesada exitosamente»<\u002Fli><li>«No se encontraron registros»<\u002Fli><li>Jerga: «trip», «status», «dispatch», «ETA», «tracking»<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\"><button class=\"btn btn--primary\">Pedir viaje<\u002Fbutton><button class=\"btn\">Ver seguimiento<\u002Fbutton><button class=\"btn btn--ghost\">Guardar borrador<\u002Fbutton><button class=\"btn btn--danger\">Cancelar viaje<\u002Fbutton><\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:11.5px;color:var(--ink-3)\">Formatos es-AR: $12.500 · 16 sep · mar 16 sep 2027 · 14:30 · semana desde el lunes · patente AE 421 KL · viaje VJ-2419.<\u002Fp><\u002Fdiv><\u002Ffigure><\u002Fsection>\n\n<section id=\"color\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">02<\u002Fp><h2>Color<\u002Fh2><p>El naranja no se toca. Los neutros cálidos se oscurecieron un paso para cumplir AA en texto chico.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"note note--warn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg><span><strong>Regla de contraste sobre naranja.<\u002Fstrong> Blanco sobre #E85D2A da 3.5:1. Texto chico (botones, badges, links) va en tinta <code style=\"font-family:var(--font-mono)\">--on-accent<\u002Fcode>. El blanco <code style=\"font-family:var(--font-mono)\">--on-accent-large<\u002Fcode> queda sólo para texto grande: ≥ 19 px bold o ≥ 24 px regular, donde 3.5:1 cumple AA. Para naranja como texto sobre claro, usá <code style=\"font-family:var(--font-mono)\">--accent-ink<\u002Fcode> (#A63B14, 6.4:1).<\u002Fspan><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">#E85D2A no se toca. Sobre naranja el texto va en tinta, nunca en blanco.<\u002Ffigcaption><div class=\"doc-card\"><div class=\"row\"><div class=\"sw\"><i style=\"background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent<\u002Fb><code>#E85D2A<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-hover);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent-hover<\u002Fb><code>#F06A38<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-press);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent-press<\u002Fb><code>#D2521F<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-ink);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent-ink<\u002Fb><code>#A63B14<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent-soft<\u002Fb><code>#FBE4D6<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-softer);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:12px\">Aa<\u002Fi><b>--accent-softer<\u002Fb><code>#FFF1E7<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Blanco sobre #E85D2A da 3.5:1 y no pasa AA en texto chico. La solución del sistema: tinta sobre naranja.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\"><div style=\"background:var(--accent);color:var(--on-accent);border-radius:8px;padding:12px 14px\"><b style=\"font-size:13px\">Confirmar viaje<\u002Fb><div style=\"font-family:var(--font-mono);font-size:10.5px;margin-top:6px;opacity:.85\">tinta / naranja · 4.9:1 ✓<\u002Fdiv><\u002Fdiv><div style=\"background:var(--accent);color:#fff;border-radius:8px;padding:12px 14px;position:relative\"><b style=\"font-size:13px;text-decoration:line-through\">Confirmar viaje<\u002Fb><div style=\"font-family:var(--font-mono);font-size:10.5px;margin-top:6px\">blanco / naranja · 3.5:1 ✗<\u002Fdiv><\u002Fdiv><div style=\"background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px\"><b style=\"font-size:13px;color:var(--accent-ink)\">Ver seguimiento →<\u002Fb><div style=\"font-family:var(--font-mono);font-size:10.5px;margin-top:6px;color:var(--ink-3)\">--accent-ink / blanco · 6.4:1 ✓<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<div class=\"grid-12\"><div class=\"span-6\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Neutros cálidos. --bg para la app, --surface para cards, --surface-2 para el sidebar.<\u002Ffigcaption><div class=\"doc-card\"><div class=\"row\"><div class=\"sw\"><i style=\"background:var(--bg)\"><\u002Fi><b>--bg<\u002Fb><code>#FAF7F1<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface)\"><\u002Fi><b>--surface<\u002Fb><code>#FFFFFF<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface-2)\"><\u002Fi><b>--surface-2<\u002Fb><code>#F2EDE2<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface-3)\"><\u002Fi><b>--surface-3<\u002Fb><code>#ECE9E1<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--line)\"><\u002Fi><b>--line<\u002Fb><code>#E8E4DA<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--line-strong)\"><\u002Fi><b>--line-strong<\u002Fb><code>#D9D3C5<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface-ink)\"><\u002Fi><b>--surface-ink<\u002Fb><code>#1B1A17<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><\u002Fdiv><div class=\"span-6\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">--ink-3 pasó de #8C8676 a #665F50 para dar AA en metadata de 11–12 px. --ink-4 nunca lleva texto informativo.<\u002Ffigcaption><div class=\"doc-card\"><div class=\"row\"><div class=\"sw\"><i style=\"background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px\">Aa<\u002Fi><b>--ink<\u002Fb><code>#1B1A17<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--ink-2);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px\">Aa<\u002Fi><b>--ink-2<\u002Fb><code>#3F3B34<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--ink-3);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px\">Aa<\u002Fi><b>--ink-3<\u002Fb><code>#665F50<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--ink-4)\"><\u002Fi><b>--ink-4 · deshabilitado<\u002Fb><code>#B8B2A2<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--on-ink)\"><\u002Fi><b>--on-ink<\u002Fb><code>#FFFFFF<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Tres valores por familia: base (íconos, puntos), ink (texto chico sobre soft, ≥4.5:1) y soft (fondo).<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><i style=\"flex:1;height:40px;border-radius:6px;background:var(--ok)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--ok-ink)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--ok-soft);border:1px solid var(--line)\"><\u002Fi><\u002Fdiv><span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:5px;background:var(--ok-soft);color:var(--ok-ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Entregado<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);line-height:1.6\">--ok #2F8F4E<br>--ok-ink #1F6B39<br>--ok-soft #DCEFD8<\u002Fcode><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><i style=\"flex:1;height:40px;border-radius:6px;background:var(--warn)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--warn-ink)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--warn-soft);border:1px solid var(--line)\"><\u002Fi><\u002Fdiv><span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn-ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Buscando<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);line-height:1.6\">--warn #C98A12<br>--warn-ink #8A5E0B<br>--warn-soft #FBEFCE<\u002Fcode><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><i style=\"flex:1;height:40px;border-radius:6px;background:var(--err)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--err-ink)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--err-soft);border:1px solid var(--line)\"><\u002Fi><\u002Fdiv><span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:5px;background:var(--err-soft);color:var(--err-ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Cancelado<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);line-height:1.6\">--err #B83232<br>--err-ink #9C2626<br>--err-soft #F5D9D4<\u002Fcode><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><i style=\"flex:1;height:40px;border-radius:6px;background:var(--info)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--info-ink)\"><\u002Fi><i style=\"flex:1;height:40px;border-radius:6px;background:var(--info-soft);border:1px solid var(--line)\"><\u002Fi><\u002Fdiv><span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:5px;background:var(--info-soft);color:var(--info-ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Próximo<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);line-height:1.6\">--info #2E6FB7<br>--info-ink #22578F<br>--info-soft #D8E4F2<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">data-theme=<\u002Ffigcaption><div class=\"doc-card\"><div data-theme=\"dark\" style=\"background:var(--bg);color:var(--ink);padding:14px;border-radius:10px;margin:-16px;display:flex;flex-direction:column;gap:12px\"><div class=\"row\"><div class=\"sw\"><i style=\"background:var(--bg)\"><\u002Fi><b>--bg<\u002Fb><code>#141310<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface)\"><\u002Fi><b>--surface<\u002Fb><code>#1C1A16<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--surface-2)\"><\u002Fi><b>--surface-2<\u002Fb><code>#23201B<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--line)\"><\u002Fi><b>--line<\u002Fb><code>#2E2A24<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--ink)\"><\u002Fi><b>--ink<\u002Fb><code>#F4F0E7<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--ink-3)\"><\u002Fi><b>--ink-3<\u002Fb><code>#9E978A<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-ink)\"><\u002Fi><b>--accent-ink<\u002Fb><code>#F0865A<\u002Fcode><\u002Fdiv><div class=\"sw\"><i style=\"background:var(--accent-soft)\"><\u002Fi><b>--accent-soft<\u002Fb><code>#3B2116<\u002Fcode><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:var(--accent);color:var(--on-accent);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px\">Confirmar viaje<\u002Fspan><span style=\"background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px\">Cancelar<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-buscando-bg);color:var(--estado-buscando-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Buscando<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-en-curso-bg);color:var(--estado-en-curso-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>En ruta<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-entregado-bg);color:var(--estado-entregado-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Entregado<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<p style=\"font-size:13px;color:var(--ink-2);margin:0;line-height:1.55;max-width:720px\">El tema oscuro se activa con <code style=\"font-family:var(--font-mono)\">data-theme=\"dark\"<\u002Fcode> en <code style=\"font-family:var(--font-mono)\">&lt;html&gt;<\u002Fcode> o en cualquier contenedor y sólo redefine tokens semánticos: ningún componente tiene reglas propias para oscuro. Hereda la paleta de la app del conductor.<\u002Fp><\u002Fsection>\n\n<section id=\"tipografia\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">03<\u002Fp><h2>Tipografía<\u002Fh2><p>Cuatro familias con un rol cada una. Nunca se mezclan dentro de un mismo elemento.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Números y títulos. Un solo peso. Tracking -0.02em en tamaños grandes.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:flex;flex-direction:column;gap:10px;font-family:var(--font-display);line-height:1.05;letter-spacing:-0.02em\"><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:44px\">$184.500<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">--text-display-xl 44 · precio del viaje<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:32px\">37 viajes<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">--text-display-lg 32 · KPI<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:28px;letter-spacing:-0.01em\">Tus viajes de septiembre<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">--text-display-md 28 · h2<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:17px;letter-spacing:0\">Todavía no hay viajes<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">--text-display-sm 17<\u002Fcode><span style=\"font-size:14px;letter-spacing:0;margin-left:10px\">Gasto por zona<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">--text-display-xs 14 · título de card<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Cuerpo e interfaz. 400 body, 500–600 labels, 700 badges. Mínimo 11 px.<\u002Ffigcaption><div class=\"doc-card\"><div style=\"display:flex;flex-direction:column;gap:9px\"><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:16px\">Completá los datos del viaje y te conectamos con un conductor.<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">16 · lead<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:14px\">Tu pedido fue enviado. Estamos buscando un conductor.<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">14 · body<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:13px;font-weight:500;color:var(--ink-2)\">Analytics · Record · En curso · Facturación<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">13 · nav 500<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:12px;color:var(--ink-3)\">16 sep · $12.500 · Avellaneda<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)\">12 · metadata --ink-3<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;co -radius:50%;background:currentColor\"><\u002Fi>Cargando<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-3)\">CARGANDO<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-en-curso-bg);color:var(--estado-en-curso-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>En ruta<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-3)\">EN_RUTA<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-en-curso-bg);color:var(--estado-en-curso-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Descargando<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-3)\">DESCARGANDO<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-entregado-bg);color:var(--estado-entregado-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Entregado<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-3)\">FINALIZADO<\u002Fcode><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--estado-cancelado-bg);color:var(--estado-cancelado-fg);font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase\"><i style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\u002Fi>Cancelado<\u002Fspan><code style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-3)\">CANCELADO<\u002Fcode><\u002Fdiv><\u002Fdiv>\n<p style=\"margin:14px 0 0;color:var(--ink-3);font-size:11.5px\">Clase BEM: <code style=\"font-family:var(--font-mono)\">.status.{ESTADO}<\u002Fcode> · tokens <code style=\"font-family:var(--font-mono)\">--estado-{familia}-bg / -fg<\u002Fcode><\u002Fp><\u002Fdiv><\u002Ffigure>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.55;color:var(--ink-2)\"><div class=\"span-4 stack stack--tight\"><span class=\"status BUSCANDO_CONDUCTOR\" style=\"align-self:flex-start\">Buscando<\u002Fspan><span>Ámbar y latiendo: el único estado donde el cliente espera algo de la plataforma. Si dura más de 20 min, la fila muestra una nota con «Avisar a Fleter».<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><span class=\"status EN_RUTA\" style=\"align-self:flex-start\">En ruta<\u002Fspan><span>Naranja para todo lo que está en movimiento (en camino, cargando, en ruta, descargando). El banner superior sólo aparece en estos cuatro estados.<\u002Fspan><\u002Fdiv><div class=\"span-4 stack stack--tight\"><span class=\"status FINALIZADO\" style=\"align-self:flex-start\">Entregado<\u002Fspan><span>Verde recién con foto del remito conformado. Sin foto, el viaje sigue en Descargando aunque el conductor se haya ido.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"viaje\" class=\"stack\" style=\"gap:16px\"><div class=\"section-header\" style=\"margin:0\"><div><p class=\"eyebrow\">08<\u002Fp><h2>El viaje: 9 datos y detalle<\u002Fh2><p>Regla 2. La fila del listado y el detalle que se abre al tocarla.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid-12\" style=\"font-size:13px;line-height:1.6;color:var(--ink-2)\"><div class=\"card span-7\"><strong style=\"color:var(--ink);display:block;margin-bottom:8px\">Los 9 datos de la fila, en este orden<\u002Fstrong><ol style=\"margin:0;padding-left:18px;columns:2;column-gap:24px\"><li>Fecha y hora<\u002Fli><li>Origen (dirección y localidad)<\u002Fli><li>Cantidad de paradas («Sin paradas», «1 parada», «2 paradas»)<\u002Fli><li>Destino (dirección y localidad)<\u002Fli><li>Condiciones de carga o «Sin condiciones»<\u002Fli><li>Distancia total en km<\u002Fli><li>Tiempo estimado<\u002Fli><li>Precio estimado (o final, si terminó)<\u002Fli><li>Estado<\u002Fli><\u002Fol><\u002Fdiv><div class=\"card card--soft span-5\"><strong style=\"color:var(--ink);display:block;margin-bottom:6px\">Qué no se hace<\u002Fstrong>No se corta ninguna dirección con puntos suspensivos: la fila crece. No se oculta un dato que todavía no existe: dice «A confirmar». No se resume el recorrido a «origen → destino»: la cantidad de paradas siempre está. El id del viaje acompaña a la fecha, en mono, más chico.<\u002Fdiv><\u002Fdiv>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\"><figcaption style=\"font-size:12px;color:var(--ink-3)\">Cada fila muestra siempre: fecha y hora, origen, cantidad de paradas, destino, condiciones (o «Sin condiciones»), distancia, tiempo, precio y estado. Nada se corta; lo que falta dice «A confirmar». Click abre el detalle.<\u002Ffigcaption><div class=\"doc-card\"><div class=\"stack\"><div class=\"trips-table\"><div class=\"trips-table__head\"><span>Fecha y hora<\u002Fspan><span>Recorrido<\u002Fspan><span>Condiciones<\u002Fspan><span>Distancia · tiempo<\u002Fspan><span style=\"text-align:right\">Precio<\u002Fspan><span>Estado<\u002Fspan><span><\u002Fspan><\u002Fdiv><a class=\"trip-row is-selected\" href=\"#\"><div class=\"trip-row__cell trip-row__meta\" data-label=\"Fecha y hora\"><strong>Hoy<\u002Fstrong><span class=\"trip-row__hora\">14:30<\u002Fspan><span class=\"trip-row__id\">VJ-2419<\u002Fspan><\u002Fdiv><div class=\"trip-row__cell trip-row__route\" data-label=\"Recorrido\"><div class=\"route-stops\"><div class=\"route-stops__marker\"><i class=\"route-stops__dot\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__addr\">Av. Belgrano 1250<\u002Fp><p class=\"route-stops__loc\">Avellaneda<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--parada\"><\u002Fi><i class=\"route-stops__line\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop route-stops__stop--paradas\"><p class=\"route-stops__paradas\">2 paradas<\u002Fp><\u002Fdiv><div class=\"route-stops__marker\"><i class=\"route-stops__dot route-stops__dot--destino\"><\u002Fi><\u002Fdiv><div class=\"route-stops__stop\"><p class=\"route-stops__addr\">Ruta 8 km 52<\u002Fp><p class=\"route-stops__loc\">Pilar<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"trip-row__cell trip-row__cond\" data-label=\"Condiciones\">Frágil · Con hidrogrúa<\u002Fdiv><div class=\"trip-row__cell trip-row__dist\" data-label=\"Distancia · tiempo\"><strong>52 km<\u002Fstrong>1 h 40<\u002Fdiv><div class=\"trip-row__cell trip-row__price\" data-label=\"Precio\">$48.200<small>estimado<\u002Fsmall><\u002Fdiv><div class=\"trip-row__cell trip-row__status\" data-label=\"Estado\"><span class=\"status EN_RUTA\">En ruta<\u002Fspan><\u002Fdiv><span class=\"trip-row__chevron\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa><a class=\"trip-row\" href=\"#\"><div class=\"trip-row__cell trip-row__meta\" data-label=\"Fecha y hora\"><strong>Hoy<\u002Fstrong><span class=\"trip-row__hora\">16:00<\u002Fspan><span class=\"trip-row__id\">VJ-2420<\u002Fspan><\u002Fdiv><div class=\"trip-row__cell trip-row__route\" data-label=\"Recorrido\"><div class=\"route-sto
